[project]
name = "openenv-daw"
version = "0.1.0.dev0"
description = "OpenEnv environment for DAW tool use: a lightweight JSON DAW simulator behind a portable MCP tool set"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "openenv>=0.13,<0.14",
    "fastmcp>=3,<4",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
server = ["uvicorn>=0.30"]
ui = ["gradio[oauth]>=4"]  # the Space web UI
trl = ["trl>=1.17", "datasets"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10", "types-pyyaml", "httpx>=0.27"]

[project.entry-points."openenv_daw.backends"]
sim = "openenv_daw.server.backends:SimBackend"

[project.scripts]
server = "openenv_daw.server.app:main"
openenv-daw = "openenv_daw.cli:main"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

# The package root is this folder (the `openenv init` layout); the import name is `openenv_daw`.
[tool.setuptools]
include-package-data = true
packages = [
    "openenv_daw",
    "openenv_daw.server",
    "openenv_daw.server.sim",
    "openenv_daw.server.rewards",
    "openenv_daw.server.tasks",
    "openenv_daw.server.ui",
    "openenv_daw.adapters",
]

[tool.setuptools.package-dir]
openenv_daw = "."
"openenv_daw.server" = "server"
"openenv_daw.server.sim" = "server/sim"
"openenv_daw.server.rewards" = "server/rewards"
"openenv_daw.server.tasks" = "server/tasks"
"openenv_daw.server.ui" = "server/ui"
"openenv_daw.adapters" = "adapters"

[tool.setuptools.package-data]
"openenv_daw" = ["py.typed"]
"openenv_daw.server" = ["instructions.md"]
"openenv_daw.server.sim" = ["*.yaml"]
"openenv_daw.server.tasks" = ["*.jsonl", "*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --import-mode=importlib"

[tool.ruff]
extend-exclude = ["examples"]
line-length = 100
target-version = "py312"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

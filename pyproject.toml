[project]
name = "openenv-daw"
version = "0.1.0"
description = "OpenEnv environment for DAW tool use: a lightweight JSON DAW simulator behind a portable MCP tool set"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "openenv==0.13.0",
    "fastmcp>=3,<4",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
runner = ["openai>=1.40", "httpx>=0.27"]
trl = ["trl>=1.17"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10", "types-pyyaml", "httpx>=0.27"]

[project.scripts]
openenv-daw-server = "openenv_daw.server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openenv_daw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
extend-exclude = ["examples"]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
mypy_path = "src"
explicit_package_bases = true

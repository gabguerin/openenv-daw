    kind: preset
    base: simple_synth
    tags: [bass, dubstep, aggressive, saw, dirty]
    overrides: {waveform: 0.125, cutoff: 0.55, resonance: 0.55, detune: 0.3, release: 0.3}
  robot_lead:

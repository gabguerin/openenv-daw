# Canonical, DAW-agnostic library of named sounds, presets and plugins. The agent finds entries with
# list_devices(query=...) and loads them with insert_device(device=<id>); it never browses folders.
# Adapters map each id to the DAW's own item (see openenv_daw.adapters.devices); an unmapped id is
# reported as unavailable.
#
# kind: preset  built on a catalog device (`base`); loads as that device with `overrides`
#               (normalized 0..1) applied, so its parameters stay editable.
#       rack    a native DAW rack or instrument without catalog parameters: loads read-only.
#       plugin  a third-party plugin: loads read-only and needs the `third_party_plugin`
#               capability (the default `portable` profile does not offer it).
# waveform steps: saw 0.125, square 0.375, sine 0.625, triangle 0.875.
items:
  # --- synth presets (simple_synth) -----------------------------------------------------------
  sub_bass:
    name: Sub Bass
    kind: preset
    base: simple_synth
    tags: [bass, sub, low, deep, 808]
    overrides: {waveform: 0.625, cutoff: 0.45, resonance: 0.0, attack: 0.1, release: 0.4}
  hip_hop_bass:
    name: Hip-Hop Bass
    kind: preset
    base: simple_synth
    tags: [bass, hip-hop, rap, trap, low]
    overrides: {waveform: 0.375, cutoff: 0.5, resonance: 0.1, attack: 0.05, release: 0.35}
  pixel_bass:

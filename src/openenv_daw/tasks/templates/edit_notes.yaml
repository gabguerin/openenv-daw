family: edit_notes
weight: 0.08
slots:
  track: {train: [Lead, Keys, Melody], heldout: [Arp, Topline]}
  pitch: {train: [E4, G4, A4], heldout: [D4, B4, F4]}
  add: {train: [C5, E5, G4], heldout: [D5, A4, B4]}
  beat: {train: [8, 10], heldout: [12, 14]}
templates:
  - {id: t1, split: train, text: "The {track} track already has a one-octave C major idea in its clip. Transpose every note up one octave and keep everything else as it is."}
  - {id: t2, split: train, text: "On {track}, remove every {pitch} from the existing clip. Leave the other notes alone."}
  - {id: t3, split: train, text: "Add a single {add} note to the clip on {track}, starting at beat {beat} (counting from 0). Keep all existing notes."}
  - {id: h1, split: heldout, text: "Shift the whole phrase on {track} up by an octave (12 semitones); nothing else should change."}
  - {id: h2, split: heldout, text: "Delete all {pitch} notes from the clip on {track} but keep the rest of the phrase."}
  - {id: h3, split: heldout, text: "Extend the phrase on {track} with one {add} note placed at beat {beat} (first beat is 0); the existing notes must stay."}

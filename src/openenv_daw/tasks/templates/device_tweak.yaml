family: device_tweak
weight: 0.08
slots:
  track: {train: [Lead, Bass, Vocals, Pad], heldout: [Keys, Strings, Horns]}
  setting:
    train:
      - "simple_synth|cutoff|2000|2 kHz"
      - "simple_synth|attack|100|100 ms"
      - "compressor|ratio|4|4:1"
      - "reverb|decay|2|2 seconds"
      - "delay|time|250|250 ms"
      - "eq|mid_gain|-6|-6 dB"
    heldout:
      - "simple_synth|release|1000|1 second"
      - "compressor|threshold|-24|-24 dB"
      - "delay|feedback|50|50%"
      - "limiter|ceiling|-3|-3 dB"
      - "eq|mid_freq|1000|1 kHz"
templates:
  - {id: t1, split: train, text: "The {track} track has the {device} device on it. Set its {param} to {text}. The display value must be within 5% of the target."}
  - {id: t2, split: train, text: "Tweak the {device} on {track}: {param} should read {text} (within 5%)."}
  - {id: h1, split: heldout, text: "Dial the {param} of {track}'s {device} to {text}; getting within 5% of that display value is enough."}
  - {id: h2, split: heldout, text: "On {track}, find the {device} and make its {param} {text} (a display value within 5% passes)."}

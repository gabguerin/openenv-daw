spec_version: 1
name: openenv_daw
version: 0.2.0
type: space
runtime: fastapi
app: openenv_daw.server.app:app
port: 8000
validation:
  reward:
    range: [0.0, 1.0]
    oracle_tolerance: 0.0
    floor_margin: 0.1
  resources:
    cpu: 1.0
    memory_mb: 1024
    disk_mb: 512
    episode_timeout_s: 120.0
  capabilities:
    verifier:
      kind: reward_channel
    declared_tools:
      - get_session
      - set_transport
      - create_track
      - delete_track
      - rename_track
      - create_midi_clip
      - delete_clip
      - insert_midi_notes
      - remove_midi_notes
      - set_mixer_channel
      - set_send
      - list_devices
      - insert_device
      - get_device_params
      - set_device_param
      - submit
  types:
    tags: [music, daw, tool-use, mcp]
